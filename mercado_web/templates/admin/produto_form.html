{% extends 'base.html' %}
{% block title %}{% if produto %}Editar produto{% else %}Novo produto{% endif %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-7">
        <div class="card app-card shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="fw-bold mb-1">{% if produto %}Editar produto{% else %}Cadastrar produto{% endif %}</h1>
                        <p class="text-secondary mb-0">Preencha os campos abaixo para salvar no catálogo.</p>
                    </div>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Voltar</a>
                </div>

                <form method="post" class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label">Nome</label>
                        <input type="text" name="nome" class="form-control" value="{{ produto.nome if produto else '' }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Preço</label>
                        <input type="number" step="0.01" min="0" name="preco" class="form-control" value="{{ produto.preco if produto else '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Categoria</label>
                        <input type="text" name="categoria" class="form-control" value="{{ produto.categoria if produto else '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Estoque</label>
                        <input type="number" min="0" name="estoque" class="form-control" value="{{ produto.estoque if produto else 0 }}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Descrição</label>
                        <textarea name="descricao" class="form-control" rows="4">{{ produto.descricao if produto else '' }}</textarea>
                    </div>
                    <div class="col-12 d-grid d-md-flex justify-content-md-end gap-2 mt-3">
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-light border">Cancelar</a>
                        <button class="btn btn-success">Salvar produto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
